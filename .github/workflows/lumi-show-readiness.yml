name: LUMI Show Readiness

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "show-engine.mjs"
      - "character-engine.mjs"
      - "scene-director.mjs"
      - "interaction-visualizer.mjs"
      - "show-simulator.mjs"
      - "live-show-runtime.mjs"
      - "live-show-runtime.test.mjs"
      - "visual-renderer.mjs"
      - "visual-renderer.test.mjs"
      - ".github/workflows/lumi-show-readiness.yml"

jobs:
  runtime-integration:
    name: Live Runtime Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Display Node version
        run: node --version

      - name: Syntax check Show Engine
        run: node --check show-engine.mjs

      - name: Syntax check Character Engine
        run: node --check character-engine.mjs

      - name: Syntax check Scene Director
        run: node --check scene-director.mjs

      - name: Syntax check Interaction Visualizer
        run: node --check interaction-visualizer.mjs

      - name: Syntax check Live Show Runtime
        run: node --check live-show-runtime.mjs

      - name: Syntax check Live Runtime Tests
        run: node --check live-show-runtime.test.mjs

      - name: Run Live Runtime Integration Tests
        run: node live-show-runtime.test.mjs

  visual-preview:
    name: Visual Renderer Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Display FFmpeg version
        run: ffmpeg -version | head -n 3

      - name: Syntax check Visual Renderer
        run: node --check visual-renderer.mjs

      - name: Syntax check Visual Renderer Test
        run: node --check visual-renderer.test.mjs

      - name: Generate and validate visual preview
        run: node visual-renderer.test.mjs

      - name: Inspect preview file
        run: |
          ls -lh lumi-visual-preview.mp4
          ffprobe \
            -v error \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of json \
            lumi-visual-preview.mp4

      - name: Upload LUMI visual preview
        uses: actions/upload-artifact@v4
        with:
          name: lumi-visual-preview
          path: lumi-visual-preview.mp4
          retention-days: 7

  readiness:
    name: Day-One Show Readiness (${{ matrix.duration }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        duration:
          - 30
          - 60
          - 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Display Node version
        run: node --version

      - name: Syntax check Show Engine
        run: node --check show-engine.mjs

      - name: Syntax check Character Engine
        run: node --check character-engine.mjs

      - name: Syntax check Scene Director
        run: node --check scene-director.mjs

      - name: Syntax check Interaction Visualizer
        run: node --check interaction-visualizer.mjs

      - name: Syntax check Show Simulator
        run: node --check show-simulator.mjs

      - name: Run ${{ matrix.duration }} minute simulation
        run: |
          node show-simulator.mjs ${{ matrix.duration }} \
            > lumi-show-${{ matrix.duration }}m.json

      - name: Print simulation result
        if: always()
        run: |
          cat lumi-show-${{ matrix.duration }}m.json || true

      - name: Validate PASS verdict
        run: |
          node -e "
          const fs = require('fs');
          const file = 'lumi-show-${{ matrix.duration }}m.json';
          const result = JSON.parse(fs.readFileSync(file, 'utf8'));

          console.log('Duration:', result.simulation?.minutes, 'minutes');
          console.log('Verdict:', result.verdict);
          console.log('Show events:', result.show?.showEvents);
          console.log('Rare events:', result.show?.rareEvents);
          console.log('Max overlays:', result.visual?.maxOverlays);
          console.log('Failed checks:', result.failedChecks);

          if (result.verdict !== 'PASS') {
            console.error('LUMI SHOW READINESS FAILED');
            process.exit(1);
          }

          console.log('LUMI SHOW READINESS PASS');
          "

      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-show-${{ matrix.duration }}m-report
          path: lumi-show-${{ matrix.duration }}m.json
          retention-days: 7
